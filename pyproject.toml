[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-reliability-agent"
version = "0.1.0"
description = "Evidence-first agentic investigation for unfamiliar tabular data"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pydantic>=2.6"]

[project.scripts]
data-reliability = "data_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

